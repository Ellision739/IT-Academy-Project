<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Личная библиотека{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="{% url 'index' %}">📚 MyLibrary</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="{% url 'index' %}">Главная</a>
                <a class="nav-link" href="{% url 'book_list' %}">Каталог книг</a>
            </div>
            <div class="navbar-nav">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3 text-white">Привет, <strong>{{ user.username }}</strong>!</span>
                    <a class="nav-link me-3" href="{% url 'my_books' %}">Мои книги</a>

                    <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center mb-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-primary btn-sm me-2" href="{% url 'login' %}">Войти</a>
                    <a class="btn btn-primary btn-sm" href="{% url 'register' %}">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer mt-auto py-3 bg-white border-top text-center text-muted">
        <div class="container">
            <span>&copy; 2026 ИТ-Академия ТУСУР. Итоговый проект.</span>
        </div>
    </footer>

</body>
</html>
